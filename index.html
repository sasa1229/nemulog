<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101728">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ねむログ">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ねむログ — 夜の帳簿</title>
<style>
:root{
  --bg:#14131A; --bg2:#1A1822; --panel:#211F2B; --panel2:#2A2735; --line:#413C4D;
  --ink:#E9E3D7; --ink2:#BBB2A3; --ink3:#948B7C;
  --amber:#F0B368; --amber2:#DE8F4B; --teal:#5FC6B6; --violet:#A794DD;
  --rose:#E88B78; --lime:#98D69E; --dawn:#8DA6C6;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:17px; line-height:1.75; font-weight:500;
  letter-spacing:.005em; -webkit-text-size-adjust:100%;
  padding-bottom:96px; overscroll-behavior-y:none;
  transition:filter .6s ease;
}
/* 深夜（23:00〜5:00）は自動でさらに落ち着いた色合いにする。設定でON/OFF可 */
body.dim{ filter:brightness(.86) saturate(.8) sepia(.06); }
h1,h2,h3,h4{font-weight:800;letter-spacing:.01em;line-height:1.4;margin:0}
.serif{font-weight:800}
button,input,select,textarea{font-family:inherit;font-size:17px;color:inherit;font-weight:600}
button{cursor:pointer;border:none;background:none}
a{color:var(--dawn)}
:focus-visible{outline:3px solid var(--dawn);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- shell ---- */
header.top{
  padding:14px 18px 12px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#1A2440,#101728); position:sticky; top:0; z-index:20;
  padding-top:max(14px,env(safe-area-inset-top));
}
header.top .r1{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top .brand{font-size:21px;font-weight:800;letter-spacing:.06em}
.lvl{display:flex;align-items:center;gap:9px;flex:1;max-width:210px}
.lvl .n{font-size:13px;font-weight:800;color:var(--amber);white-space:nowrap}
.lvl .bar{flex:1;height:10px;border-radius:99px;background:#0D1424;border:1px solid var(--line);overflow:hidden}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber2),var(--amber));transition:width .7s ease}
main{padding:16px 15px 8px;max-width:720px;margin:0 auto}
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:rgba(16,23,40,.97);backdrop-filter:blur(14px);
  border-top:1px solid var(--line); padding:8px 5px calc(8px + env(safe-area-inset-bottom));
}
nav.tabs button{flex:1;padding:9px 2px;color:var(--ink3);font-size:12px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:14px;min-height:56px}
nav.tabs button .g{font-size:21px;line-height:1}
nav.tabs button[aria-current="true"]{color:#20160A;background:linear-gradient(180deg,var(--amber),var(--amber2));
  box-shadow:0 4px 14px rgba(255,159,69,.28)}
.view{display:none}.view.on{display:block;animation:fade .28s ease}
/* opacityのみ（transformを入れない）。transformを animate すると、その間 position:fixed の
   子要素（.cta-fixedなど）の基準点がビューポートからこの要素にズレてしまうため */
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---- primitives ---- */
.card{background:linear-gradient(180deg,var(--panel),#19243F);border:1px solid var(--line);
  border-radius:var(--r);padding:18px;margin:0 0 15px;box-shadow:0 3px 0 rgba(0,0,0,.25);
  overflow:hidden;min-width:0}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--amber);margin:0 0 10px}
.mut{color:var(--ink2)}
.small{font-size:15px;line-height:1.7}
.tiny{font-size:13.5px;color:var(--ink3);line-height:1.65;font-weight:500}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.spread{justify-content:space-between}
.btn{background:linear-gradient(180deg,var(--amber),var(--amber2));color:#231605;font-weight:800;
  padding:16px 20px;border-radius:15px;letter-spacing:.02em;display:inline-block;text-align:center;
  box-shadow:0 4px 0 #B96F22; font-size:17px}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn.dawn{background:linear-gradient(180deg,#7EC0FF,var(--dawn));color:#08182B;box-shadow:0 4px 0 #3C6E9E}
.btn.block{display:block;width:100%}
.btn:active{transform:translateY(3px);box-shadow:none}
.chip{border:2px solid var(--line);background:var(--panel2);color:var(--ink2);
  padding:11px 16px;border-radius:99px;font-size:15.5px;font-weight:700;min-height:46px}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--amber),var(--amber2));
  border-color:var(--amber);color:#231605;box-shadow:0 3px 0 #B96F22}
label.f{display:block;margin:14px 0 0}
label.f span{display:block;font-size:14.5px;font-weight:700;color:var(--ink2);margin-bottom:7px}
input,select,textarea{width:100%;max-width:100%;min-width:0;background:#0E1526;
  border:2px solid var(--line);border-radius:13px;padding:13px 12px;display:block}
input[type="time"],input[type="number"],input[type="file"]{-webkit-appearance:none;appearance:none}
input[type="time"]{text-align:center;padding-left:6px;padding-right:6px}
input[type="file"]{font-size:14px;padding:10px}
textarea{min-height:80px;resize:vertical;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.grid2>*{min-width:0}
.divider{height:1px;background:var(--line);margin:17px 0}
.badge{font-size:13px;font-weight:800;padding:5px 11px;border-radius:99px;
  border:2px solid var(--line);color:var(--ink2)}
.badge.ok{color:#0F2A17;background:var(--lime);border-color:var(--lime)}
.badge.warn{color:#2A1B04;background:var(--amber);border-color:var(--amber)}
.badge.bad{color:#2B0D08;background:var(--rose);border-color:var(--rose)}

/* ---- signature: 時刻表 ---- */
.hero{position:relative;padding:24px 18px 20px;border:2px solid var(--line);border-radius:26px;margin-bottom:15px;
  background:radial-gradient(130% 100% at 50% 0%,#2A3A66 0%,#1B2745 55%,#141D33 100%);
  box-shadow:0 6px 0 rgba(0,0,0,.3);overflow:hidden}
.hero .label{font-size:14px;font-weight:800;letter-spacing:.14em;color:var(--amber);text-align:center}
.hero .time{font-size:78px;font-weight:800;line-height:1;text-align:center;margin:8px 0 6px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  background:linear-gradient(180deg,#FFF6E6,var(--amber));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.hero .note{text-align:center;font-size:14.5px;color:var(--ink2);font-weight:600}
.hero .mode{text-align:center;margin-top:12px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.hero .deco{position:absolute;right:-10px;bottom:-6px;width:150px;height:70px;opacity:.22;pointer-events:none}

/* ---- 今夜: 最上部/固定CTA ---- */
.cta-primary{display:flex;align-items:center;gap:14px;width:100%;min-height:88px;
  background:linear-gradient(180deg,var(--amber),var(--amber2));border-radius:30px;
  padding:16px 20px;margin-bottom:15px;box-shadow:0 4px 0 #B96F22,0 0 26px rgba(240,176,77,.28)}
.cta-primary .g{font-size:34px;flex-shrink:0}
.cta-primary .tx{flex:1;text-align:left}
.cta-primary .tx b{display:block;font-size:22px;font-weight:800;color:#2E2417}
.cta-primary .tx span{display:block;font-size:13.5px;font-weight:700;color:#5A3F1C;margin-top:2px}
.cta-primary .arrow{font-size:22px;color:#5A3F1C;flex-shrink:0}
.cta-primary:active{transform:translateY(3px);box-shadow:none}
.cta-link{display:block;text-align:center;font-size:14.5px;font-weight:700;color:var(--dawn);margin:-6px 0 15px}
.cta-fixed{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;
  display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,var(--amber),var(--amber2));
  color:#2E2417;font-weight:800;font-size:14.5px;padding:10px 20px;border-radius:99px;
  box-shadow:0 6px 18px rgba(0,0,0,.45),0 0 16px rgba(240,176,77,.3)}

/* ---- 今夜は：ひとり／一緒に寝る ---- */
.partner{display:flex;gap:8px}
.partner button{flex:1;padding:14px 8px;border-radius:18px;border:2px solid var(--line);
  background:transparent;color:var(--ink2);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:7px}
.partner button[aria-pressed="true"]{background:linear-gradient(180deg,var(--amber),var(--amber2));
  border-color:var(--amber);color:#2E2417;box-shadow:0 0 14px rgba(240,176,77,.3),0 3px 0 #B96F22}

/* ---- 今夜の目安（簡易ステップ） ---- */
.steps{margin:6px 0 0;padding:0;list-style:none}
.steps li{display:flex;align-items:flex-start;gap:12px;padding:9px 0;
  border-bottom:1px dashed rgba(255,255,255,.1)}
.steps li:last-child{border-bottom:none}
.steps li .num{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px}
.steps li .g{font-size:16px}
.steps li .b{flex:1;font-size:15.5px;font-weight:700}
.steps li .b em{display:block;font-style:normal;font-size:12.5px;font-weight:500;color:var(--ink3);margin-top:1px}
.steps li .t{font-size:14.5px;font-weight:700;color:var(--ink2);white-space:nowrap;padding-top:2px}
.steps li.key .t{color:var(--amber);font-size:17px}
.steps li.key .b{color:var(--amber)}

/* ---- 遅番情報 3分割 ---- */
.late3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.late3 div{background:#0E1526;border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.late3 .g{font-size:17px;display:block;margin-bottom:4px}
.late3 b{display:block;font-size:14.5px;font-weight:800}
.late3 span{font-size:11.5px;color:var(--ink3);font-weight:700}

/* ---- ショートカット2枚 ---- */
.shortrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.shortrow button{background:linear-gradient(180deg,var(--panel),#19243F);border:2px solid var(--line);
  border-radius:18px;padding:14px 14px;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.shortrow button .g{font-size:20px}
.shortrow button b{display:block;font-size:14.5px;font-weight:800;margin-top:8px}
.shortrow button span{display:block;font-size:12px;color:var(--ink3);font-weight:600;margin-top:2px}
.shortrow button .arrow{float:right;color:var(--ink3)}


/* ---- meter / ring ---- */
.meter{height:14px;border-radius:99px;background:#0D1424;border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--amber));transition:width .7s ease}
.big{font-size:44px;white-space:nowrap;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat div{background:#0E1526;border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stat div b{display:block;font-size:26px;font-weight:800}
.stat div span{font-size:12.5px;font-weight:700;color:var(--ink3)}

/* ---- stamps ---- */
.stamps{display:flex;gap:6px}
.stamps i{flex:1;min-width:0;height:46px;border:2px dashed var(--line);border-radius:11px;display:grid;place-items:center;
  font-size:17px;font-weight:800;color:var(--ink3);font-style:normal;background:#0E1526}
.stamps i.on{border-style:solid;border-color:var(--amber);color:#231605;
  background:linear-gradient(180deg,var(--amber),var(--amber2));box-shadow:0 3px 0 #B96F22;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6) rotate(-12deg)}70%{transform:scale(1.12)}100%{transform:none}}
.streak{display:inline-flex;align-items:center;gap:6px;background:#0E1526;border:2px solid var(--line);
  border-radius:99px;padding:7px 14px;font-weight:800;font-size:15px}
.streak b{color:var(--amber);font-size:19px}

/* ---- 知識 ---- */
.mast{border-bottom:3px solid var(--amber);padding:8px 0 12px;margin-bottom:18px}
.mast h2{font-size:30px;letter-spacing:.02em}
.mast p{margin:6px 0 0;font-size:14px;font-weight:700;color:var(--ink3)}
.lead{border:2px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:15px;
  background:linear-gradient(150deg,#2C3D6B,#1A2440);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.lead .body{padding:18px}
.lead h3{font-size:24px;margin:8px 0 10px}
.artgrid{display:grid;gap:12px}
.art{border:2px solid var(--line);border-radius:18px;padding:15px 16px;
  background:linear-gradient(180deg,var(--panel),#19243F);text-align:left;width:100%;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.art .no{font-size:13px;font-weight:800;color:var(--amber);letter-spacing:.06em}
.art h4{font-size:18.5px;margin:7px 0 6px}
.art.locked{opacity:.45}
.ev{font-size:12.5px;font-weight:800;padding:4px 9px;border-radius:8px;border:2px solid var(--line);white-space:nowrap}
.ev.e3{color:#0F2A17;background:var(--lime);border-color:var(--lime)}
.ev.e2{color:#08182B;background:var(--dawn);border-color:var(--dawn)}
.ev.e1{color:#2A1B04;background:var(--amber);border-color:var(--amber)}
.ev.myth{color:#2B0D08;background:var(--rose);border-color:var(--rose)}
article.read h2{font-size:28px;line-height:1.45;margin:10px 0 12px}
.kicker{font-size:13.5px;font-weight:800;color:var(--amber)}
article.read .kicker{font-size:13.5px;font-weight:800;color:var(--amber)}
article.read .leadp{font-size:17px;font-weight:700;border-left:4px solid var(--amber);padding-left:14px;margin:16px 0}
article.read .concl{background:#0E1526;border:2px solid var(--amber);border-radius:16px;padding:15px 16px;margin:18px 0}
article.read .concl b{font-size:13.5px;letter-spacing:.1em;color:var(--amber);display:block;margin-bottom:7px}
article.read h3{font-size:19.5px;margin:26px 0 8px;color:var(--amber)}
article.read p{margin:0 0 14px;font-weight:500}
article.read .fig{border:2px solid var(--line);border-radius:16px;padding:16px;margin:18px 0;background:#0E1526}
article.read .src{font-size:13.5px;color:var(--ink3);margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
article.read .src div{margin-bottom:5px;word-break:break-all}

/* ---- misc ---- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;font-weight:800;color:var(--ink3);text-align:center}
.cal .d{border:2px solid var(--line);border-radius:10px;min-height:48px;min-width:0;padding:4px 2px;font-size:10px;
  background:#0E1526;text-align:center;font-weight:600;overflow:hidden}
.cal .d b{font-size:13px;font-weight:800;display:block;color:var(--ink)}
.cal .d.late{border-color:var(--amber);background:rgba(255,193,94,.14)}
.cal .d.work{border-color:var(--dawn);background:rgba(121,180,240,.1)}
.cal .d.empty{border:none;background:none;min-height:0}
.cal .d em{font-style:normal;display:block;color:var(--ink2);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cal-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.cal-legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3);font-weight:700}
.cal-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;
  background:linear-gradient(180deg,var(--amber),var(--amber2));color:#231605;font-weight:800;
  padding:14px 20px;border-radius:99px;font-size:15.5px;z-index:60;box-shadow:0 8px 26px rgba(0,0,0,.55)}
.sheet{position:fixed;inset:0;background:rgba(6,9,16,.78);z-index:50;display:flex;align-items:flex-end}
.sheet .in{background:var(--bg2);border-top-left-radius:24px;border-top-right-radius:24px;
  padding:20px 16px calc(30px + env(safe-area-inset-bottom));
  width:100%;max-height:88vh;overflow:auto;border-top:2px solid var(--line)}
.wizard{max-width:520px;margin:0 auto}
.q{margin-bottom:20px}
.q p{margin:0 0 10px}
ul.plain{padding-left:20px;margin:10px 0}ul.plain li{margin-bottom:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.kv:last-child{border:none}
.kv b{font-variant-numeric:tabular-nums;font-weight:800}
.suggest{background:#0E1526;border:2px solid var(--amber);border-radius:16px;padding:14px 16px;margin-top:14px}
.suggest b{font-size:13px;letter-spacing:.08em;color:var(--amber);display:block;margin-bottom:6px;font-weight:800}
.rankgrade{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:18px;
  font-size:32px;font-weight:800;background:linear-gradient(180deg,var(--amber),var(--amber2));color:#231605;
  box-shadow:0 4px 0 #B96F22;flex-shrink:0}
.warnbar{background:var(--rose);color:#2B0D08;font-weight:800;padding:12px 16px;font-size:15px;
  border-radius:14px;margin-bottom:14px}
.instr{counter-reset:st;list-style:none;padding:0;margin:12px 0 0}
.instr li{counter-increment:st;position:relative;padding-left:40px;margin-bottom:12px;font-weight:600}
.instr li:before{content:counter(st);position:absolute;left:0;top:1px;width:28px;height:28px;border-radius:50%;
  background:var(--amber);color:#231605;font-weight:800;display:grid;place-items:center;font-size:15px}
</style>
</head>
<body>
<header class="top">
  <div class="r1">
    <div class="brand">ねむログ</div>
    <div class="lvl" id="lvl"></div>
  </div>
</header>

<main>
  <section id="v-home" class="view on"></section>
  <section id="v-log" class="view"></section>
  <section id="v-shift" class="view"></section>
  <section id="v-analyze" class="view"></section>
  <section id="v-sound" class="view"></section>
  <section id="v-know" class="view"></section>
  <section id="v-set" class="view"></section>
</main>

<nav class="tabs" id="tabs"></nav>
<div id="sheet"></div>

<script>
"use strict";
/* ============ storage (localStorage、使えなければメモリ) ============ */
const mem={};
let STORE_OK=false;
(function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); STORE_OK=true; }catch(e){ STORE_OK=false; } })();
const store={
  get(k){ try{const v=localStorage.getItem(k);return v===null?(k in mem?mem[k]:null):v;}catch(e){return k in mem?mem[k]:null;} },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); localStorage.setItem(k+".bak."+(new Date().getDate()%2), v); STORE_OK=true; }catch(e){ STORE_OK=false; } }
};
const KEY="nemulog.v1";
const DEFAULTS={
  profile:{ name:"", ageBand:"18-25", usualBed:"00:30", usualWake:"08:00",
    goal:"morning", chronotype:null, onboarded:false },
  settings:{
    preset:"vacation",              // vacation | school
    schoolWake:"07:15", prepMin:70,
    vacationWakeCap:"09:00",
    needMin:null,                   // 手動上書き
    latencyMin:15, bathMin:22, careMin:20,
    lateThreshold:"23:00", lateBasis:"home", lateGraceMin:90, normalWindowMin:30,
    lateHandling:"lateMode",        // lateMode | exempt
    surplusWeight:0.5, debtWindow:14,
    places:{
      "エブリー":{commuteMin:15, afterMin:60, afterLabel:"ジム", mealMin:20, mealWeight:"普通"},
      "やきとり":{commuteMin:30, afterMin:0, afterLabel:"", mealMin:10, mealWeight:"軽め",
                  lastTrain:"23:48", rideMin:25, stationHomeMin:5, fixedArrival:"00:18"}
    },
    reminders:{bath:true, caffeine:true},
    nightMode:"auto",               // auto(23-5時に自動で落ち着かせる) | on | off
    sound:{base:210, beat:6, volume:0.14, lowPitch:false, noiseType:"white", timerMin:30}
  },
  records:{},   // date(起床日) -> rec
  shifts:{},    // date -> {place,start,end,actualEnd,gym}
  plans:{},     // date -> {title,startTime,travelMin,prepMin}
  range:{from:null,to:null},
  game:{points:0, streak:0, insurance:1, stamps:0, cards:0, badges:[], themes:["night"], exempt:[]},
  read:{},      // articleId -> true
  overrides:{}, // date -> {wake:"06:30"}
  experiment:null // {testIdx, label, start, end} 自己実験モード（1つだけ）
};
let S=load();
function load(){
  try{ const raw=store.get(KEY); if(!raw) return deep(DEFAULTS);
    const o=JSON.parse(raw); return merge(deep(DEFAULTS),o);
  }catch(e){ return deep(DEFAULTS); }
}
function save(){ store.set(KEY,JSON.stringify(S)); }
function deep(o){ return JSON.parse(JSON.stringify(o)); }
function merge(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])) merge(a[k],b[k]); else a[k]=b[k]; } return a; }

/* ============ 時刻ユーティリティ ============ */
// 夜の時刻は「正午起点の分」で扱う（23:45→705、01:30→810）
const pad=n=>String(n).padStart(2,"0");
function hm2min(s){ if(!s)return null; const[a,b]=s.split(":").map(Number); return a*60+b; }
function min2hm(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+":"+pad(m%60); }
function night(s){ const m=hm2min(s); if(m===null)return null; return m<720? m+1440-720 : m-720; } // 正午起点
function unNight(v){ return min2hm(((v%1440)+1440)%1440 + 720); }
function dur(m){ const s=m<0?"−":""; m=Math.abs(Math.round(m)); return s+Math.floor(m/60)+"時間"+pad(m%60)+"分"; }
function durShort(m){ m=Math.round(m); const s=m<0?"−":""; m=Math.abs(m); return s+(Math.floor(m/60)?Math.floor(m/60)+"h":"")+pad(m%60)+"m"; }
function today(){ const d=new Date(); return iso(d); }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseISO(s){ const[y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function dow(s){ return "日月火水木金土"[parseISO(s).getDay()]; }
function md(s){ const[,m,d]=s.split("-"); return Number(m)+"/"+Number(d); }
function median(a){ if(!a.length)return null; const b=[...a].sort((x,y)=>x-y); const i=Math.floor(b.length/2);
  return b.length%2?b[i]:(b[i-1]+b[i])/2; }
function quantile(a,q){ if(!a.length)return null; const b=[...a].sort((x,y)=>x-y);
  const p=(b.length-1)*q, lo=Math.floor(p), hi=Math.ceil(p); return lo===hi?b[lo]:b[lo]+(b[hi]-b[lo])*(p-lo); }

/* ============ 予定・シフトからその日の枠を出す ============ */
function isSchoolPeriod(date){
  // 9月以降を学校期間とする簡易判定（プリセットは手動でも切替可）
  if(S.settings.preset==="school") return true;
  if(S.settings.preset==="vacation") return false;
  return Number(date.split("-")[1])>=9;
}
// その朝の起床デッドライン（date = 起きる日）
function wakeTarget(date){
  const ov=S.overrides[date]; if(ov&&ov.wake) return {hm:ov.wake, why:"手動指定"};
  const cands=[];
  const sh=S.shifts[date];
  if(sh&&sh.start){ const p=S.settings.places[sh.place]||{commuteMin:20};
    cands.push({m:hm2min(sh.start)-(p.commuteMin||20)-S.settings.prepMin, why:sh.place+"出勤"}); }
  const pl=S.plans[date];
  if(pl&&pl.startTime) cands.push({m:hm2min(pl.startTime)-(pl.travelMin||20)-(pl.prepMin||S.settings.prepMin), why:pl.title||"予定"});
  const d=parseISO(date).getDay();
  if(isSchoolPeriod(date) && d>=1 && d<=5) cands.push({m:hm2min(S.settings.schoolWake), why:"学校"});
  // 上限は必ず候補に入れる。昼からの出勤日に「起床15:20」のような無意味な値を出さないため
  cands.push({m:hm2min(S.settings.vacationWakeCap), why:"仮の起床上限"});
  cands.sort((a,b)=>a.m-b.m);
  return {hm:min2hm(cands[0].m), why:cands[0].why};
}
// 帰宅時刻（その夜 = date の夜に働く場合。shift は「働く日」で保持）
function homeArrival(date){
  const sh=S.shifts[date]; if(!sh||!sh.end) return null;
  const p=S.settings.places[sh.place]||{commuteMin:25,afterMin:0};
  const end=sh.actualEnd||sh.end;
  const endN=night(end);
  if(p.fixedArrival && night(end)>=night(S.settings.lateThreshold)){
    return {hm:p.fixedArrival, n:night(p.fixedArrival), why:"終電"+p.lastTrain};
  }
  const gym=(sh.gym!==false && (p.afterMin||0)>0)?p.afterMin:0;
  const extra = p.fixedArrival ? ((p.rideMin||25)+(p.stationHomeMin||5)+15) : ((p.commuteMin||20)+gym);
  const n=endN+extra;
  return {hm:unNight(n), n, why:(gym?p.afterLabel+(gym)+"分＋":"")+"移動"+(p.fixedArrival?((p.rideMin||25)+(p.stationHomeMin||5))+"分（待ち込み）":(p.commuteMin||20)+"分")};
}
function needMin(){
  const est=estimateNeed();
  return S.settings.needMin || est.value;
}
// 今夜の計画（date = 寝る日＝夜側の日付）
function plan(date){
  const wakeDate=addDays(date,1);
  const wt=wakeTarget(wakeDate);
  const need=needMin();
  const lat=S.settings.latencyMin;
  const wakeNn=night(wt.hm); // 07:15 -> 1155（正午起点の分）
  const normalBedN=wakeNn-need-lat;
  const ha=homeArrival(date);
  const th=night(S.settings.lateThreshold);
  const sh=S.shifts[date];
  let isLate=false;
  if(sh&&sh.end){
    const basisN = S.settings.lateBasis==="home" ? (ha?ha.n:night(sh.actualEnd||sh.end)) : night(sh.actualEnd||sh.end);
    isLate = basisN>=th;
  }
  let bedN=normalBedN, mode= isLate?"late":"normal";
  if(isLate && ha) bedN=Math.min(ha.n+S.settings.lateGraceMin, normalBedN);
  const mealPre = ha? (S.settings.places[sh.place]?.mealMin||15) : 0;
  // 帰宅が遅くて目標に間に合わない夜：目標を成立可能な最早に置き、不足見込みを別に出す
  let shortfall=0;
  if(ha){ const minBlock=3+mealPre+10+S.settings.careMin;
    if(bedN < ha.n+minBlock){ shortfall=ha.n+minBlock-bedN; bedN=ha.n+minBlock; } }
  const startN = ha? ha.n : Math.max(bedN-150, night("21:00"));
  const slack = bedN-startN;
  // 入浴プラン
  let wait,bath,label;
  if(!ha){ wait=90;bath=S.settings.bathMin;label="通常（40℃で15分ほど）"; }
  else if(slack>=120){ wait=90;bath=S.settings.bathMin;label="通常（40℃で15分ほど）"; }
  else if(slack>=60){ wait=45;bath=S.settings.bathMin;label="短め（40℃で10分以内）"; }
  else if(slack>=30){ wait=25;bath=15;label="ぬるめ38〜39℃でさっと／シャワー＋足湯"; }
  else { wait=0;bath=10;label="シャワーのみ（体温を上げない）"; }
  const meal = ha? (S.settings.places[sh.place]?.mealMin||15) : 0;
  const mealStartN = ha? ha.n+3 : null;
  // 待ち時間は残り時間に収める。ケア時間（スキンケア・ドライヤー）が物理的な下限
  if(ha){ const maxWait=slack-3-meal-bath; wait=Math.min(wait,Math.max(S.settings.careMin,maxWait)); }
  const realWait=Math.max(wait,S.settings.careMin);
  const bathEndN=bedN-realWait;
  const bathStartN=bathEndN-bath;
  const needBlock = ha? (meal + bath + S.settings.careMin) : 0;
  const feasibleN = ha? ha.n+3+needBlock : null;
  const conflict = ha? (mealStartN+meal > bathStartN) : false;
  return {date,wakeDate,wakeTarget:wt,need,lat,bedN,mode,isLate,ha,slack,needBlock,feasibleN,shortfall,
    bathPlan:{wait,realWait,bath,label,bathStartN,bathEndN},
    meal:{min:meal,startN:mealStartN,weight:S.settings.places[sh?.place]?.mealWeight},
    conflict, shift:sh||null};
}

/* ============ 分析 ============ */
function recArr(){ return Object.keys(S.records).sort().map(d=>({date:d,...S.records[d]})); }
function sleepMin(r){
  if(r.bandTotal) return r.bandTotal;
  if(r.inBed&&r.wake){
    let a=night(r.inBed), b=night(r.wake); if(b<a)b+=1440;
    return Math.max(0,b-a-(r.latency??S.settings.latencyMin));
  }
  return null;
}
function conf(r){ return r.bandTotal?"高":(r.inBed&&r.wake&&r.latency!=null?"中":"低"); }
function midSleep(r){
  if(!r.inBed||!r.wake) return null;
  let a=night(r.inBed)+(r.latency??S.settings.latencyMin), b=night(r.wake); if(b<a)b+=1440;
  return (a+b)/2;
}
function estimateNeed(){
  const rs=recArr().filter(r=>sleepMin(r));
  const free=rs.filter(r=>r.isFreeDay&&!r.alarmUsed).map(r=>sleepMin(r));
  if(free.length>=3) return {value:Math.round(median(free)), conf:free.length>=5?"高":"中", how:"自由睡眠日"+free.length+"日の中央値", n:rs.length};
  const good=rs.filter(r=>(r.refreshed||0)>=4).map(r=>sleepMin(r));
  if(good.length>=5) return {value:Math.round(quantile(good,.25)), conf:"中", how:"スッキリ度4以上の日"+good.length+"日の下位25%点", n:rs.length};
  const u=(()=>{ let a=night(S.profile.usualBed),b=night(S.profile.usualWake); if(b<a)b+=1440; return b-a-S.settings.latencyMin; })();
  return {value:Math.max(360,Math.min(600,Math.round(u))), conf:"低（推定中）", how:"初回入力のいつもの時刻から", n:rs.length};
}
function debt(){
  const need=needMin(), w=S.settings.debtWindow;
  let sum=0; const series=[];
  for(let i=w-1;i>=0;i--){
    const d=addDays(today(),-i), r=S.records[d];
    const t=r?sleepMin(r):null;
    if(t!=null){ const df=Math.max(0,need-t), sp=Math.max(0,t-need)*S.settings.surplusWeight; sum=Math.max(0,sum+df-sp); }
    series.push({date:d,v:Math.round(sum)});
  }
  return {min:Math.round(sum), series, need};
}
function dayType(d){
  const prevNight=addDays(d,-1), sh=S.shifts[prevNight];
  if(sh&&sh.start){ const p=plan(prevNight); return p.isLate?"遅番":"バイト（通常）"; }
  const wt=wakeTarget(d);
  if(wt.why==="仮の起床上限") return "自由（休日）";
  if(wt.why==="学校") return "学校";
  return "予定あり";
}
function dayTypeCompare(){
  const rs=recArr().filter(r=>sleepMin(r)!=null);
  const groups={};
  rs.forEach(r=>{ const k=dayType(r.date); (groups[k]=groups[k]||[]).push(r); });
  const order=["遅番","バイト（通常）","学校","予定あり","自由（休日）"];
  const rows=order.filter(k=>groups[k]&&groups[k].length>=3).map(k=>{
    const g=groups[k];
    const avgSleep=Math.round(g.reduce((s,r)=>s+sleepMin(r),0)/g.length);
    const refr=g.map(r=>r.refreshed).filter(v=>v!=null);
    const avgRef=refr.length?(refr.reduce((a,b)=>a+b,0)/refr.length).toFixed(1):null;
    return `<div class="kv"><span>${k}（${g.length}日）</span><b>${dur(avgSleep)}${avgRef?"　スッキリ "+avgRef:""}</b></div>`;
  });
  return rows.length?rows.join(""):`<p class="small mut">日タイプごとに3日以上たまると比較が出ます。</p>`;
}
function socialJetlag(){
  const rs=recArr().filter(r=>midSleep(r)!=null).slice(-28);
  const con=[],fre=[];
  rs.forEach(r=>{ const wt=wakeTarget(r.date); const constrained = wt.why!=="仮の起床上限";
    (constrained?con:fre).push(midSleep(r)); });
  if(con.length<2||fre.length<2) return null;
  return {min:Math.round(Math.abs(median(fre)-median(con))), nc:con.length, nf:fre.length};
}
function score(date){
  const r=S.records[date]; if(!r) return null;
  const t=sleepMin(r); if(t==null) return null;
  const need=needMin();
  const sDur=Math.min(1,t/need)*40;
  const ms=midSleep(r), all=recArr().map(midSleep).filter(v=>v!=null);
  let sReg=15;
  if(ms!=null&&all.length>=3){ const dev=Math.abs(ms-median(all)); sReg=Math.max(0,1-dev/90)*30; }
  const sRef=r.refreshed? (r.refreshed-1)/4*30 : 0;
  return {total:Math.round(sDur+sReg+sRef), dur:Math.round(sDur), reg:Math.round(sReg), ref:Math.round(sRef)};
}
function promiseResult(date){ // date=寝る日
  const r=S.records[addDays(date,1)]; if(!r||!r.inBed) return null;
  const p=plan(date);
  if(S.settings.lateHandling==="exempt"&&p.isLate) return {ok:null,why:"免除日"};
  const actual=night(r.inBed);
  if(p.isLate&&p.ha){ const lim=p.ha.n+S.settings.lateGraceMin;
    return {ok:actual<=Math.min(lim,p.bedN)+0.001, why:"遅番モード（帰宅から"+S.settings.lateGraceMin+"分以内）", target:unNight(Math.min(lim,p.bedN))};}
  return {ok:Math.abs(actual-p.bedN)<=S.settings.normalWindowMin, why:"通常（目標±"+S.settings.normalWindowMin+"分）", target:unNight(p.bedN)};
}
function lastNightResult(){ return promiseResult(addDays(today(),-1)); }
function discrepancy(r){
  if(!r||!r.bandTotal||!r.refreshed) return false;
  const good=r.bandTotal>=needMin()-15;
  return (good&&r.refreshed<=2)||(!good&&r.refreshed>=5);
}

    {h:"だから記録する",p:"つまり、これは調べれば答えが出る話ではなく、自分で試して確かめる話です。このアプリで入眠サウンド・入浴・食事のパターンを記録しておけば、数週間で「自分にとってのポジティブルーティン」が見えてきます。"},
    {h:"退屈が効く",p:"脳のスイッチを切るには、刺激を減らすことがいちばん確実です。帰宅後に照明を落とす、同じ順番で支度をする、寝る前の30分は新しい情報を入れない。派手な工夫より、単調さのほうが効きます。"}],
   src:["西野精治『スタンフォード式 最高の睡眠』","https://liniere.jp/column/health/17659/"]},

  {id:"a4",no:"特集 4",ev:3,min:3,unlock:"always",
   t:"眠りの借金は、借りていなくてもたまる",
   lead:"毎日30分の不足は、週で3時間半の借金になる。そして週末には返せない。",
   concl:"睡眠負債は数日では解消しない。十分な睡眠を3〜4週間続けて、はじめて返せる。",
   ev2:"睡眠負債の概念と「短期間では返済できない」ことは広く合意されています。返済に必要な期間の見積もりには幅があります。",
   body:[
    {h:"自覚がないのが厄介",p:"自分では足りていると思っている人でも、わずかな不足が積み上がっていることがあります。これが睡眠負債で、「行動誘発性睡眠不足症候群」として睡眠障害の一種と見なされることもあります。2〜3日たっぷり寝た程度では解消せず、十分に眠る生活を3〜4週間ほど続ける必要があるとされています。"},
    {h:"必要な量は人それぞれ",p:"必要睡眠時間には遺伝的な個人差があります。だから他人の平均値ではなく、自分で実験して把握するしかありません。実務的な手順としては、平日と休日の就寝・起床をそろえ、就寝を30分早めて5日から1週間続け、体調やパフォーマンスが上がったかを確かめる、という方法が紹介されています。"},
    {h:"分割返済のほうが効く",p:"週末に一気に返そうとすると、起床時刻が大きくずれて体内リズムが崩れます（次の記事）。平日に少しずつ割り振って返すほうが、リズムを保ったまま総量を増やせます。このアプリは「1日あたり20〜60分を3週間」という形で返済プランを出します。"},
    {h:"アプリの計算方法",p:"日々の不足を積み上げ、必要以上に寝た分は半分だけ返済に充当します（寝だめでは完全に返せないため）。累積は直近14日分だけを見ます。無期限に積むと数字が膨らむだけで、行動につながらないからです。この重みと期間は設定で変えられます。"}],
   src:["湧永製薬「睡眠負債」https://www.wakunaga.co.jp/health_info/","https://books.bunshun.jp/articles/-/8451"]},

  {id:"b1",no:"基礎 01",ev:3,min:3,unlock:"always",
   t:"自分の必要睡眠時間を測る、3つの方法",
   lead:"7〜9時間という推奨レンジは出発点。自分の数字は自分で測る。",
   concl:"アラームなしで自然に起きられる日の睡眠時間が、いちばん確かな手がかり。",
   ev2:"自由睡眠による必要量の推定は睡眠医学で標準的な考え方です。日数や分位点の細かい設定は実務的な判断です。",
   body:[
    {h:"方法1：連続4晩、好きなだけ寝る",p:"目覚ましを使わず自然に起きるまで寝る日を、できれば4晩続けます。初日は長く眠り、2晩目以降は徐々に短くなって、3〜4晩目で安定してきます。その安定した時間が、自分に十分な睡眠の目安です。連休や夏休みが使えます。"},
    {h:"方法2：調子が良かった日から逆算する",p:"朝のスッキリ度が高かった日の睡眠時間を集め、その下のほうの値を見ます。「これ以上寝ればだいたい調子が良い」という最小ラインが見えます。日常生活のまま測れるのが利点です。"},
    {h:"方法3：平日と休日の差から推定する",p:"休日の平均から平日の平均を引き、休日の日数分を1週間に均します。手軽ですが「休日で返せている」前提が必要なので、参考値にとどめてください。"},
    {h:"このアプリの扱い",p:"記録が14日未満のあいだは「推定中」と表示し、初回入力のいつもの時刻から暫定値を使います。自由睡眠日が3日たまると方法1に、スッキリ度の記録が5日たまると方法2に自動で切り替わります。"}],
   src:["https://kokoronoclinic.net/hiyoshi/","https://www.suimin.co.jp/column/insufficiency_02"]},

  {id:"b2",no:"基礎 02",ev:3,min:3,unlock:"days:3",
   t:"社会的ジェットラグ — 休日の寝坊は、時差のある旅と同じ",
   lead:"平日と休日で睡眠の中央時刻が2時間ずれると、体は時差ボケになる。",
   concl:"休日の起床は平日プラス2時間以内。足りない分は20分の昼寝で。",
   ev2:"社会的ジェットラグと健康リスクの関連は多くの研究で報告されています。2時間という線は目安です。",
   body:[
    {h:"計算のしかた",p:"就寝と起床のちょうど真ん中を睡眠中央時刻と呼びます。深夜2時に寝て10時に起きるなら、中央時刻は6時。平日が3時30分なら、差は2時間30分です。研究では、この差が2時間を超えると健康リスクが高まる可能性が示されています。"},
    {h:"体感としての重さ",p:"平日7時起きの人が休日に10時過ぎまで寝ると、差は3時間超になります。これは週末のあいだに時差3時間半の地域へ往復して、月曜の朝に出勤するのと同程度の負担だと説明されます。月曜がつらいのは、意志の問題ではありません。"},
    {h:"シフト生活での見方",p:"平日と休日で分けるだけでは、シフトのある生活では正しく出ません。このアプリは「起床時刻に制約がある日」と「自由に起きられる日」で分けて計算します。金土に遅番が入る学校期間は、ここが最大のリスクになります。"},
    {h:"打ち手",p:"いちばん効くのは、休日も起床時刻をなるべく動かさないこと。どうしても長く寝たい日は平日プラス2時間以内に収め、残りは短い昼寝で埋めます。そして翌日が学校の夜（日曜）は、平日と同じ時刻に寝ることを優先します。"}],
   src:["https://sleep1.jp/social_jet_lag/","https://next.rikunabi.com/journal/20200129_t01_s/"]},

  {id:"b3",no:"基礎 03",ev:3,min:2,unlock:"days:5",
   t:"睡眠休養感 — 時間より大事かもしれない指標",
   lead:"何時間寝たかより、朝に「休めた」と感じるか。",
   concl:"時間が足りていても休養感が低いなら、原因は長さ以外にある。",
   ev2:"近年の睡眠ガイドで重視されている指標です。",
   body:[
    {h:"長さだけでは足りない",p:"同じ7時間でも、すっきり起きられる日と体が重い日があります。近年の睡眠ガイドでは、睡眠時間と並んで「起きたときに休めた感じがあるか」が重視されるようになりました。時間は満たしているのに休養感が低い場合、長さを伸ばすより原因を探すほうが有効です。"},
    {h:"よくある原因",p:"就寝直前のアルコール、寝室の温度や明るさ、寝る直前の食事、そして呼吸の問題（いびきや無呼吸）。どれも睡眠時間には表れませんが、休養感を確実に下げます。"},
    {h:"だから朝の3問",p:"このアプリで毎朝答える3問（スッキリ度・寝つき・中途覚醒）は、飾りではなく分析の軸です。入浴や食事の記録は、この3問と突き合わせてはじめて意味を持ちます。逆に3問だけは、他をサボっても続けてください。"}],
   src:["https://ii-nemuri.press/special/hours_of_sleep_is_necessary/"]},

  {id:"b4",no:"基礎 04",ev:2,min:2,unlock:"days:7",
   t:"アラーム音を変えるだけで、朝が変わるかもしれない",
   lead:"「ピピピ」ではなく、メロディのある音。研究はそう示している。",
   concl:"メロディックだと感じる音のほうが、起床後のぼんやり感が軽い傾向がある。",
   ev2:"50人の自己申告調査。著者自身が、より大規模な統制実験が必要だと述べています。",
   body:[
    {h:"睡眠慣性という問題",p:"起きた直後のぼんやりした状態を睡眠慣性と呼びます。通常30分ほど、長い場合は起床後2〜4時間続き、その間は判断力や作業能力が落ちます。事故につながることもあり、交代勤務者や緊急対応の職種では実害のある問題として扱われています。"},
    {h:"研究が見つけたこと",p:"RMIT大学の2020年の研究では、参加者が「メロディックだ」と評価した起床音は、睡眠慣性の軽減と有意に関連していました。逆に「メロディックでもないし非メロディックでもない」中間的な音は、ぼんやり感を増やす方向に関連していました。研究者は、旋律の上下が脳の準備運動のように働くのではないかと推測しています。"},
    {h:"どう使うか",p:"根拠は強くありませんが、試すコストはほぼゼロです。口ずさめるような旋律のある音に変えて、朝のスッキリ度が変わるか2週間見てみてください。このアプリはアラームそのものを鳴らしませんが、使った音の種類を記録して比較できます。"},
    {h:"あわせて効くこと",p:"起床後に光を浴びる、決まった朝の手順を作る、といったことも睡眠慣性を軽くするとされています。カーテンを開けるのを起床直後の1手目にするだけでも違います。"}],
   src:["McFarlane SJ et al. (2020) PLOS ONE 10.1371/journal.pone.0215788","https://www.rmit.edu.au/news/media-releases-and-expert-comments/2020/feb/melodic-alarms"]},

  {id:"b5",no:"基礎 05",ev:3,min:2,unlock:"days:10",
   t:"カフェインとアルコール — 眠れるのに、眠りが浅くなる",
   lead:"寝つきの良さと睡眠の質は、別のもの。",
   concl:"カフェインは就寝6時間前まで。アルコールは寝つきを良くして、後半を壊す。",
   ev2:"カフェインの半減期、アルコールによる後半の睡眠分断は、いずれも確立した知見です。",
   body:[
    {h:"カフェインは思ったより長く残る",p:"カフェインの半減期は個人差がありますが、おおむね4〜6時間。夕方6時のコーヒーは、深夜0時にもまだ半分近く残っている計算になります。寝つけたとしても、深い睡眠が減ることがあります。このアプリは就寝目標の6時間前をカフェイン終了時刻として提示します。"},
    {h:"アルコールは寝つきの薬ではない",p:"飲むと寝つきは良くなります。しかし代謝が進む後半で睡眠が分断され、中途覚醒が増え、休養感が落ちます。「よく眠るために飲む」は、前半と引き換えに後半を売っている状態です。"},
    {h:"記録して確かめる",p:"どちらも一般論ですが、効きやすさには個人差があります。摂った時刻を記録しておけば、自分にとって何時までなら大丈夫かが数週間で見えてきます。"}],
   src:["https://www.karadacare-navi.com/life/27/"]},

  {id:"b6",no:"基礎 06",ev:3,min:2,unlock:"days:12",
   t:"起床時刻を固定する理由 — 体内時計は朝で決まる",
   lead:"何時に寝るかより、何時に起きるか。体内時計はそこで合わせている。",
   concl:"就寝時刻より起床時刻をそろえるほうが、リズムを保つ効果は大きい。",
   ev2:"起床時刻と光曝露が体内時計の主要な同調因子であることは生理学的に確立しています。",
   body:[
    {h:"体内時計のリセットボタン",p:"人の体内時計は24時間よりわずかに長く、毎日リセットが必要です。いちばん強いリセット信号は、起床後に浴びる光です。起きる時刻が毎日バラバラだと、この信号もバラバラに入り、体内時計がずれていきます。"},
    {h:"就寝より起床",p:"就寝時刻は寝つきの個人差や前夜の予定で動きやすいですが、起床時刻は自分の意志である程度そろえられます。バイトのシフトで就寝が日によって変わる生活でも、起床時刻をできるだけ一定に保つほうが、体内時計への影響は小さくて済みます。"},
    {h:"このアプリでの見方",p:"週次リズムのランクは、睡眠時間だけでなく睡眠中央時刻のばらつきも見ています。就寝が多少ずれても、起床をそろえるだけでランクは改善します。休みの日に長く寝たくなったら、起床は平日プラス2時間以内を目安にしてください。"}],
   src:["https://sleep1.jp/social_jet_lag/","西野精治『スタンフォード式 最高の睡眠』"]},

  {id:"b7",no:"基礎 07",ev:3,min:2,unlock:"days:14",
   t:"光の使い方 — 朝の光と夜のスマホ",
   lead:"体内時計は光で動く。朝は浴びて、夜は避ける。それだけの話だが効果は大きい。",
   concl:"起床後30分以内に光を浴び、就寝前1〜2時間はスマホの明るさを落とす。",
   ev2:"光による体内時計の同調は生理学的に確立した知見です。",
   body:[
    {h:"朝の光が体内時計を進める",p:"起床後に強い光（屋外の光がいちばん強力）を浴びると、体内時計が前進し、その日の夜に眠くなる時刻も早まります。曇りの日の屋外でも、室内の照明よりはるかに明るいことが多いです。"},
    {h:"夜の光は逆方向に働く",p:"夜、特に就寝前に強い光やブルーライトを浴びると、体内時計が後退し、眠気を作るホルモンの分泌が遅れます。スマホの画面はこの点で影響が大きい光源です。"},
    {h:"バイト帰りの夜にできること",p:"帰宅が遅い日は、まず照明を落とすことをタイムラインの最初に置いています。強い光を追加で浴びないだけでも、体内時計への負担は減ります。画面の明るさを落とす、ナイトモードを使うといった工夫も同じ方向に効きます。"},
    {h:"やりすぎ注意",p:"深夜に強い光を浴びると、逆に体内時計が乱れて次の日の眠気に影響することがあります。夜に光を求める行動（コンビニで長時間過ごすなど）はほどほどにしてください。"}],
   src:["https://sleep1.jp/social_jet_lag/"]},

  {id:"b8",no:"基礎 08",ev:3,min:2,unlock:"days:16",
   t:"昼寝の正しい使い方 — 20分・15時まで",
   lead:"昼寝は負債の返済手段になる。ただし長さと時間帯を間違えると逆効果。",
   concl:"20分以内、15時までの昼寝なら、夜の睡眠を邪魔せずに負債を減らせる。",
   ev2:"短時間の昼寝の効果と、長い昼寝・遅い昼寝が夜の睡眠に与える悪影響は、いずれも広く支持されています。",
   body:[
    {h:"なぜ20分なのか",p:"20分を超えると深い睡眠に入り始め、そこで起きると強い眠気（睡眠慣性）を引きずります。20分以内なら浅い睡眠にとどまり、すっきり起きやすいとされています。"},
    {h:"なぜ15時までなのか",p:"遅い時間の昼寝は、夜に眠くなる力（睡眠圧）を先に使ってしまい、夜の寝つきを悪くします。15時より前という目安は、夜までに睡眠圧を十分回復させるためのものです。"},
    {h:"バイト前の仮眠にも使える",p:"遅番の日、出勤前に眠気が強いときは短い昼寝が有効です。ただし出勤直前だと仕事に眠気を持ち込みやすいので、可能なら出勤の1〜2時間前までに済ませるのがおすすめです。"},
    {h:"このアプリの扱い",p:"昼寝は減点しません。睡眠負債の返済手段として記録できます。20分以内・15時までかどうかも、時刻と長さを記録しておけば後から振り返れます。"}],
   src:["https://sleep1.jp/social_jet_lag/"]},

  {id:"m1",no:"検証 01",ev:"myth",min:2,unlock:"days:3",
   t:"「22時〜2時が成長ホルモンのゴールデンタイム」は本当か",
   lead:"広く信じられているが、根拠のない時刻信仰。",
   concl:"誤り。成長ホルモンは入眠後の最初の深い睡眠で出る。時刻ではない。",
   ev2:"時刻ではなく入眠からの経過時間で決まる、という点で否定されています。",
   body:[
    {h:"どこが間違いか",p:"成長ホルモンの分泌は、時計の針ではなく入眠からの経過時間に連動します。深夜1時に寝れば、1時からの最初の深い睡眠で出ます。『スタンフォード式最高の睡眠』でも、この俗説は明確に否定されています。"},
    {h:"なぜ広まったのか",p:"多くの人が22時〜2時に最初の深い睡眠を迎えていたため、相関が因果に見えたのだと考えられます。"},
    {h:"だから",p:"バイトで1時就寝になる日でも、「ゴールデンタイムを逃した」と落ち込む必要はありません。落ち込むべきなのは総量が足りないときだけです。時刻ではなく、量と規則性を見てください。"}],
   src:["https://liniere.jp/column/health/17659/"]},

  {id:"m2",no:"検証 02",ev:"myth",min:2,unlock:"days:5",
   t:"「90分の倍数で起きるとスッキリする」は本当か",
   lead:"計算しやすくて気持ちいいが、当てにはならない。",
   concl:"根拠は弱い。睡眠周期には80〜110分ほどの個人差があり、夜の中でも変動する。",
   ev2:"周期の個人差と夜間変動により、倍数で起床時刻を決める合理性は乏しいとされています。",
   body:[
    {h:"90分は平均値にすぎない",p:"ノンレムとレムのひと巡りはおおよそ90分と説明されますが、実際には80分から110分ほどの幅があり、同じ人でも夜の前半と後半で変わります。4.5時間や6時間という設計は、この平均を全員に当てた計算です。"},
    {h:"何が起きるか",p:"倍数に合わせるために睡眠時間を削ると、失う総量のほうが大きくなります。6時間で足りない人が「7.5時間より6時間のほうが目覚めが良いはず」と考えるのは、順序が逆です。"},
    {h:"代わりに",p:"起床時刻を固定して、そこから必要睡眠時間を引いて就寝時刻を決める。これが確実です。周期を狙いたいなら、バンドのデータが数週間たまってから自分の周期を推定するほうが筋が通っています。このアプリは倍数計算を採用していません。"}],
   src:["https://otonahealth.jp/sleep-duration-guideline/"]},

  {id:"m3",no:"検証 03",ev:1,min:2,unlock:"days:7",
   t:"モノラルビート・バイノーラルビートは効くのか",
   lead:"「深い睡眠が51%増える」という数字の出どころを見る。",
   concl:"検証中。試す価値はあるが、効くと決めつけない。自分のデータで確かめる。",
   ev2:"提供元のパイロット研究が主な根拠で、独立した大規模検証は乏しい領域です。",
   body:[
    {h:"主張されていること",p:"リナイトなどのアプリは、脳波を特定の周波数に同調させる音（モノラルビート）によって、入眠が16%早くなり深い睡眠が51%長くなるとうたっています。高音が苦手な人向けに非可聴周波数版も用意されています。"},
    {h:"根拠の強さ",p:"この数値の出どころは提供元が示すパイロット研究です。独立した第三者による大規模な検証があるわけではなく、バイノーラル／モノラルビートの睡眠効果は学術的にまだ結論が出ていません。「効かない」と断定もできませんが、「実証済み」でもありません。"},

function bandTotalUpdate(){
  if(!el("x-total")) return;
  const g=id=>el(id)?el(id).value:"";
  const total=hmPair(g("x-rem-h"),g("x-rem-m"))+hmPair(g("x-light-h"),g("x-light-m"))+hmPair(g("x-deep-h"),g("x-deep-m"));
  el("x-total").textContent = total>0? dur(total) : "—";
  const bed=g("x-bed"), wake=g("x-wake"), lat=Number(g("x-lat")||0);
  let msg="";
  if(bed&&wake&&total>0){
    let a=night(bed), b=night(wake); if(b<a)b+=1440;
    const inBedMin=b-a, diff=inBedMin-lat-total;
    msg="ベッドの中 "+dur(inBedMin)+"／差 "+(diff>=0?"+":"")+Math.round(diff)+"分"+
      (Math.abs(diff)<=10? "（つじつまが合っています）":"（差が大きいので入力を確認してください）");
  }
  el("x-check").textContent=msg;
}
function parseBand(t){
  if(!t) return null;
  const norm=t.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/：/g,":");
  const mins=(re)=>{ const m=norm.match(re); if(!m) return null;
    const seg=norm.slice(m.index, m.index+40);
    const hm=seg.match(/(\d{1,2})\s*(?:時間|h|:)\s*(\d{1,2})?/);
    if(hm) return Number(hm[1])*60+Number(hm[2]||0);
    const only=seg.match(/(\d{1,3})\s*(?:分|m)/); return only? Number(only[1]) : null; };
  const num=(re)=>{ const m=norm.match(re); if(!m) return null;
    const seg=norm.slice(m.index, m.index+30).match(/(\d{1,3})/); return seg? Number(seg[1]) : null; };
  const o={};
  o.bandTotal = mins(/(?:睡眠時間|合計睡眠|総睡眠|睡眠)/);
  o.deep = mins(/(?:深い睡眠|深睡眠|深い)/);
  o.rem  = mins(/(?:レム|REM)/);
  o.light= mins(/(?:浅い睡眠|浅い)/);
  o.awakenings = num(/(?:覚醒|目覚め|中途)/);
  o.bandScore  = num(/(?:睡眠スコア|スコア)/);
  const has=Object.keys(o).some(k=>o[k]!=null);
  return has? o : null;
}
function scale(k,label,v){
  return `<label class="f"><span>${label}</span></label><div class="row" style="margin-top:6px">
    ${[1,2,3,4,5].map(n=>`<button class="chip" data-sc="${k}:${n}" aria-pressed="${v===n}" style="flex:1">${n}</button>`).join("")}</div>`;
}
// 数字入力の代わりに使うプルダウン。既存値がステップの目盛りからずれていても消えないよう、その値を選択肢に足す
// id には "id:foo" の代わりに任意のHTML属性文字列（例 'data-pl="x:y"'）も渡せる
function numSel(id,value,min,max,step,unit,allowEmpty){
  const attr = id? (id.includes("=")? id : `id="${id}"`) : "";
  unit=unit||""; const dec=step<1?1:0;
  const cur=(value!=null&&value!=="")?Number(value):null;
  const n=Math.round((max-min)/step);
  const vals=[]; let injected=(cur==null);
  for(let i=0;i<=n;i++){
    const v=Math.round((min+i*step)*10)/10;
    if(!injected&&cur<v-1e-6){ vals.push(cur); injected=true; }
    vals.push(v);
  }
  if(!injected) vals.push(cur);
  const seen=new Set();
  let html=allowEmpty?`<option value="">未入力</option>`:"";
  vals.forEach(v=>{
    const vs=dec?v.toFixed(1):String(Math.round(v));
    if(seen.has(vs)) return; seen.add(vs);
    html+=`<option value="${vs}" ${cur!=null&&Math.abs(cur-v)<1e-6?"selected":""}>${vs}${unit}</option>`;
  });
  return `<select ${attr}>${html}</select>`;
}

function parseShiftBoard(text,year){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);

  const reDate=/^(\d{1,2})\s*[\/\-月]\s*(\d{1,2})日?\s*[（(]?([日月火水木金土])?[)）]?\s*(\d{1,2}):(\d{2})\s*[-–~〜]\s*(\d{1,2}):(\d{2})/;

    if(m){
      if(pending) out.push(pending);
      const M=Number(m[1]),D=Number(m[2]);
      let eh=Number(m[6]); const em=m[7];
      const end=(eh>=24? pad(eh-24):pad(eh))+":"+em;
      pending={date:year+"-"+pad(M)+"-"+pad(D), start:pad(Number(m[4]))+":"+m[5], end, place:""};
      continue;
    }
    const p=L.match(/^[-・･•]\s*(.+)$/);
    if(p&&pending){ pending.place=p[1].trim(); out.push(pending); pending=null; }
  }
  if(pending) out.push(pending);
  return out;
}
function applyShifts(list){

  for(let d=from; d<=to; d=addDays(d,1)) delete S.shifts[d];

    S.shifts[x.date]={place:x.place||"バイト",start:x.start,end:x.end,gym:true};

  S.range={from,to}; save();
  const late=list.filter(x=>plan(x.date).isLate).length;
  toast(list.length+"件を読み込みました（遅番 "+late+"日）");
  render();
}

const CORR_TESTS=[
  ["湯船に入った", r=>r.bathType==="tub"],
  ["湯上がりから60分以上あけた", r=>{ if(!r.bathEnd||!r.inBed)return false; let a=night(r.bathEnd),b=night(r.inBed); if(b<a)b+=1440; return b-a>=60; }],
  ["食事から3時間以上あけた", r=>{ if(!r.mealTime||!r.inBed)return false; let a=night(r.mealTime),b=night(r.inBed); if(b<a)b+=1440; return b-a>=180; }],
  ["入眠サウンドを使った", r=>!!r.soundUsed],
  ["ジムに行った", r=>!!r.gymDone],
  ["お酒を飲んだ", r=>!!r.alcohol],
  ["昼寝をした", r=>(r.napMin||0)>0],
  ["一緒に寝た", r=>!!r.sleepWithPartner]
];
// CORR_TESTSの各項目について「該当日/非該当日」のスッキリ度平均差を1回だけ計算し、
// corrTable/topCorrelationの両方で使い回す（以前は同じ集計を2回別々に行っていた）
function correlationStats(){
  const rs=recArr().filter(r=>r.refreshed);
  return CORR_TESTS.map(([n,f])=>{
    const a=rs.filter(f).map(r=>r.refreshed), b=rs.filter(r=>!f(r)).map(r=>r.refreshed);
    if(a.length<5||b.length<5) return {n,na:a.length,nb:b.length,d:null};
    const d=(a.reduce((x,y)=>x+y,0)/a.length)-(b.reduce((x,y)=>x+y,0)/b.length);
    return {n,na:a.length,nb:b.length,d};
  });
}
function corrTable(){
  return correlationStats().map(({n,na,nb,d})=>{
    if(d==null) return `<div class="kv"><span>${n}</span><b class="mut">データ不足 ${na}/${nb}</b></div>`;
    return `<div class="kv"><span>${n}</span><b style="color:${d>0.2?"var(--lime)":d<-0.2?"var(--rose)":"var(--ink2)"}">${d>0?"+":""}${d.toFixed(1)} <span class="tiny">(${na}/${nb}日)</span></b></div>`;
  }).join("");
}
function topCorrelation(){
  let best=null;
  correlationStats().forEach(({n,d,na,nb})=>{
    if(d==null) return;
    if(Math.abs(d)>=0.4 && (!best||Math.abs(d)>Math.abs(best.d))) best={n,d,na,nb};
  });
  return best;
}

/* ---- 週次レポート／週次ランク ---- */
function weekDays(){ const ds=[]; for(let i=6;i>=0;i--) ds.push(addDays(today(),-i)); return ds; }
function stdev(a){ if(a.length<2) return 0; const m=a.reduce((x,y)=>x+y,0)/a.length;
  return Math.sqrt(a.reduce((s,v)=>s+(v-m)*(v-m),0)/a.length); }
function weeklyRank(){
  const ds=weekDays(), recs=ds.map(d=>S.records[d]).filter(Boolean);
  const durs=recs.map(sleepMin).filter(v=>v!=null);
  const mids=recs.map(midSleep).filter(v=>v!=null);
  if(durs.length<4) return null;
  const dSD=stdev(durs), hasMid=mids.length>=4, mSD=hasMid?stdev(mids):null;
  const durPart=Math.max(0,1-dSD/90)*50, midPart=hasMid?Math.max(0,1-mSD/90)*50:20;
  const sc=Math.round(durPart+midPart);
  const bands=[[88,"S","とても規則正しい週でした"],[74,"A","規則正しい週でした"],[58,"B","まずまず安定した週でした"],[40,"C","ややばらつきのある週でした"],[0,"D","ばらつきが大きい週でした"]];
  const b=bands.find(x=>sc>=x[0]);
  return {score:sc,grade:b[1],label:b[2],durSD:Math.round(dSD),midSD:mSD!=null?Math.round(mSD):null,n:durs.length,hasMid};
}
function weeklyReport(){
  const ds=weekDays(), need=needMin();
  const durs=ds.map(d=>S.records[d]?sleepMin(S.records[d]):null);
  const filled=durs.filter(v=>v!=null);
  const avg=filled.length?Math.round(filled.reduce((a,b)=>a+b,0)/filled.length):null;
  const rank=weeklyRank();
  const thisShort=filled.reduce((s,t)=>s+Math.max(0,need-t),0);
  const prevDs=[]; for(let i=13;i>=7;i--) prevDs.push(addDays(today(),-i));
  const prevFilled=prevDs.map(d=>S.records[d]?sleepMin(S.records[d]):null).filter(v=>v!=null);
  const prevShort=prevFilled.reduce((s,t)=>s+Math.max(0,need-t),0);
  const trend=prevFilled.length>=3?(thisShort-prevShort):null;
  let suggestion;
  if(rank&&(rank.grade==="D"||rank.grade==="C")){
    suggestion="起きる時刻を毎日そろえることを、来週いちばんの目標にしてみてください。就寝時刻より起床時刻を一定にする方が体内時計には効きます。";
  }else if(trend!=null&&trend>60){
    suggestion="今週は先週より睡眠不足が"+dur(trend)+"増えました。来週は就寝を20〜30分早める日を数日作ってみてください。";
  }else{
    const top=topCorrelation();
    suggestion = top
      ? `「${top.n}」の日はスッキリ度が${top.d>0?"高め":"低め"}でした（${top.na}日 / ${top.nb}日）。来週も意識して試してみてください。`
      : (filled.length<4 ? "記録がもう少したまると、来週への提案が具体的になります。" : "今週は大きな崩れがありませんでした。このリズムを来週も保ちましょう。");
  }
  return {ds,durs,avg,need,rank,trend,suggestion};
}
function weekChart(ds,durs,need){
  const w=300,ht=90,n=ds.length,bw=w/n;
  const mx=Math.max(need*1.15,60,...durs.filter(v=>v!=null));
  const needY=(ht-14-(need/mx*(ht-20))).toFixed(1);
  const bars=ds.map((d,i)=>{
    const v=durs[i], x=(i*bw+bw*0.18).toFixed(1), bwid=(bw*0.64).toFixed(1);
    if(v==null) return `<rect x="${x}" y="${ht-16}" width="${bwid}" height="2" rx="1" fill="var(--line)"/>`;
    const bh=Math.max(2,v/mx*(ht-20)), y=(ht-14-bh).toFixed(1);
    return `<rect x="${x}" y="${y}" width="${bwid}" height="${bh.toFixed(1)}" rx="4" fill="${v>=need?"var(--lime)":"var(--amber)"}"/>`;
  }).join("");
  const labels=ds.map((d,i)=>`<text x="${(i*bw+bw/2).toFixed(1)}" y="${ht-2}" font-size="8" fill="var(--ink3)" text-anchor="middle">${dow(d)}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${ht}" style="width:100%;height:${ht}px">
    <line x1="0" y1="${needY}" x2="${w}" y2="${needY}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="3,3"/>
    ${bars}${labels}</svg>`;
}

/* ---- サウンド（Web Audio・音源ファイル不要） ---- */
let AC=null, AU={playing:null,nodes:null,startedAt:null,timeoutId:null};
function actx(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function resumeThen(cb){
  const ctx=actx();
  if(ctx.state==="running"){ cb(ctx); return; }
  ctx.resume().then(()=>cb(ctx)).catch(()=>cb(ctx));
}
function soundTargetDate(){ return new Date().getHours()>=15 ? addDays(today(),1) : today(); }
function stopSound(log){
  if(!AU.playing) return;
  const ctx=actx(), nodes=AU.nodes, stopType=AU.playing, startedAt=AU.startedAt;
  try{
    nodes.gain.gain.cancelScheduledValues(ctx.currentTime);
    nodes.gain.gain.setValueAtTime(nodes.gain.gain.value, ctx.currentTime);
    nodes.gain.gain.linearRampToValueAtTime(0, ctx.currentTime+0.4);
  }catch(e){}
  setTimeout(()=>{ (nodes.sources||[]).forEach(n=>{ try{n.stop();}catch(e){} }); },450);
  if(AU.timeoutId) clearTimeout(AU.timeoutId);
  if(log&&startedAt){
    const min=Math.max(1,Math.round((Date.now()-startedAt)/60000));
    const dd=soundTargetDate(), r=S.records[dd]||(S.records[dd]={});
    r.soundUsed=true; r.soundType= stopType==="mono"?"monaural":(S.settings.sound.noiseType==="rain"?"rain":"white");
    r.soundMin=(r.soundMin||0)+min; save();
  }
  AU={playing:null,nodes:null,startedAt:null,timeoutId:null};
}
function scheduleAutoStop(){
  const min=S.settings.sound.timerMin||30;
  AU.timeoutId=setTimeout(()=>{ stopSound(true); render(); toast("再生を終了しました"); }, min*60*1000);
}
function startMonaural(){
  stopSound(false);
  resumeThen(ctx=>{
    const s=S.settings.sound;
    const base = s.lowPitch? Math.min(s.base,110) : s.base;
    const o1=ctx.createOscillator(), o2=ctx.createOscillator(), gain=ctx.createGain();
    o1.frequency.value=base; o2.frequency.value=base+s.beat; gain.gain.value=0;
    o1.connect(gain); o2.connect(gain); gain.connect(ctx.destination);
    o1.start(); o2.start();
    gain.gain.linearRampToValueAtTime(s.volume, ctx.currentTime+0.6);
    AU={playing:"mono",nodes:{gain,sources:[o1,o2]},startedAt:Date.now(),timeoutId:null};
    scheduleAutoStop(); render();
  });
}
function noiseBuffer(ctx){
  const len=ctx.sampleRate*2, buf=ctx.createBuffer(1,len,ctx.sampleRate), data=buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i]=Math.random()*2-1;
  return buf;
}
function startNoise(){
  stopSound(false);
  resumeThen(ctx=>{
    const s=S.settings.sound;
    const src=ctx.createBufferSource(); src.buffer=noiseBuffer(ctx); src.loop=true;
    const filter=ctx.createBiquadFilter(); filter.type="lowpass"; filter.frequency.value=s.noiseType==="rain"?1800:6000;
    const gain=ctx.createGain(); gain.gain.value=0;
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start();
    gain.gain.linearRampToValueAtTime(s.volume, ctx.currentTime+0.6);
    const sources=[src];
    if(s.noiseType==="rain"){
      const lfo=ctx.createOscillator(), lfoGain=ctx.createGain();
      lfo.frequency.value=0.15; lfoGain.gain.value=s.volume*0.35;
      lfo.connect(lfoGain); lfoGain.connect(gain.gain); lfo.start();
      sources.push(lfo);
    }
    AU={playing:"noise",nodes:{gain,sources},startedAt:Date.now(),timeoutId:null};
    scheduleAutoStop(); render();
  });
}
function playWakeMelody(){
  resumeThen(ctx=>{
    // 出力パイプラインが温まるよう、少し先の時刻から鳴らし始める
    let t=ctx.currentTime+0.15;
    [523.25,659.25,783.99,1046.5,1318.5].forEach(f=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=f; o.type="sine";
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.34,t+0.04); g.gain.linearRampToValueAtTime(0,t+0.42);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.45); t+=0.32;
    });

  });
}

/* ============ イベント ============ */
// 入力欄をタップしたとき、キーボードや下タブに隠れないよう軽くスクロールする
document.addEventListener("focusin",e=>{
  const t=e.target;
  if(t&&t.matches&&t.matches("input,select,textarea")){
    setTimeout(()=>{ try{ t.scrollIntoView({block:"center",behavior:"smooth"}); }catch(err){} },250);
  }
});
document.addEventListener("click",e=>{
  // シートの外側（背景）をタップしたときだけ閉じる。内側の操作は通す
  if(e.target && e.target.classList && e.target.classList.contains("sheet")){ el("sheet").innerHTML=""; return; }
  const t=e.target.closest("[data-go],[data-now],[data-aw],[data-ob],[data-goal],[data-c],[data-fix],[data-day],[data-sc],[data-t],[data-bath],[data-mw],[data-save],[data-bandsheet],[data-bulksheet],[data-bulkparse],[data-bandsave],[data-codeparse],[data-bandparse],[data-mon],[data-edit],[data-close],[data-esave],[data-edel],[data-gym],[data-parse],[data-ov],[data-art],[data-read],[data-ssave],[data-dl],[data-export],[data-import],[data-pl],[data-sdstart],[data-sdstop],[data-sdlow],[data-sdwake],[data-expstart],[data-expcancel],[data-logmore],[data-partner]");
  if(!t) return;
  const D=t.dataset;

  if(D.go){ go(D.go); return; }
  if(D.ob){ obNext(Number(D.ob)); return; }
  if(D.goal){ ob.tmp.goal=D.goal; renderOnboard(); return; }
  if(D.c){ const[i,j]=D.c.split(":").map(Number); ob.tmp.chrono=ob.tmp.chrono||{}; ob.tmp.chrono[i]=j; renderOnboard(); return; }

  if(D.now){
    const now=new Date(), hm=pad(now.getHours())+":"+pad(now.getMinutes());
    if(D.now==="wake"){ const r=S.records[today()]||(S.records[today()]={}); r.wake=hm; }
    else { const dd=now.getHours()>=15? addDays(today(),1) : today();
           const r=S.records[dd]||(S.records[dd]={}); r.inBed=hm; }
    save(); toast(hm+" を記録しました"); render(); return; }
  if(D.aw!==undefined){ const r=S.records[today()]||(S.records[today()]={});
    r.awakenings = r.awakenings===Number(D.aw)? null : Number(D.aw); save(); render(); return; }
  if(D.partner!==undefined){ const dd=soundTargetDate(), r=S.records[dd]||(S.records[dd]={});
    r.sleepWithPartner=D.partner==="1"; save(); render(); return; }
  if(D.fix){
    if(D.fix==="meal"){ const sh=S.shifts[today()]; if(sh) S.settings.places[sh.place].mealMin=Math.max(8,(S.settings.places[sh.place].mealMin||15)-5); }
    if(D.fix==="wait"){ S.settings.careMin=Math.max(10,S.settings.careMin-5); }
    if(D.fix==="bed"){ S.settings.latencyMin=Math.max(5,S.settings.latencyMin-15); }
    save(); toast("調整しました"); render(); return; }

  if(D.day){ logDate=addDays(logDate||today(),Number(D.day)); render(); return; }
  if(D.sc){ const[k,v]=D.sc.split(":"); const d=(cur==="home")?today():(logDate||today());
    const r=S.records[d]||(S.records[d]={});
    r[k]=r[k]===Number(v)?null:Number(v); save(); render(); return; }
  if(D.t){ const d=logDate||today(); const r=S.records[d]||(S.records[d]={}); r[D.t]=!r[D.t]; save(); renderLog(); return; }
  if(D.bath){ const d=logDate||today(); const r=S.records[d]||(S.records[d]={}); r.bathType=r.bathType===D.bath?null:D.bath; save(); renderLog(); return; }
  if(D.mw){ const d=logDate||today(); const r=S.records[d]||(S.records[d]={}); r.mealWeight=r.mealWeight===D.mw?null:D.mw; save(); renderLog(); return; }
  if(D.save){ saveLog(); return; }
  if(D.bandsheet){ bandSheet(D.bandsheet); return; }
  if(D.bulksheet){ bulkSheet(); return; }
  if(D.bulkparse){
    const list=parseBulkBand(el("x-bulk").value);
    if(!list.length){ toast("読み取れる行がありませんでした"); return; }
    list.forEach(x=>{
      const r=S.records[x.date]||(S.records[x.date]={});
      ["inBed","wake","bandTotal","deep","rem","awakenings","bandScore"].forEach(k=>{ if(x[k]!=null) r[k]=x[k]; });
    });
    refreshGame(); save(); el("sheet").innerHTML=""; toast(list.length+"日分を取り込みました"); render(); return; }
  if(D.bandsave){
    const d=D.bandsave, r=S.records[d]||(S.records[d]={});
    const g=id=>el(id)?el(id).value:"";
    const rem=hmPair(g("x-rem-h"),g("x-rem-m")), light=hmPair(g("x-light-h"),g("x-light-m")), deep=hmPair(g("x-deep-h"),g("x-deep-m"));
    if(g("x-bed")) r.inBed=g("x-bed");
    if(g("x-wake")) r.wake=g("x-wake");
    if(g("x-lat")!=="") r.latency=Number(g("x-lat"));
    if(g("x-awk")!=="") r.awakenings=Number(g("x-awk"));
    if(rem) r.rem=rem; if(light) r.light=light; if(deep) r.deep=deep;
    if(rem+light+deep>0) r.bandTotal=rem+light+deep;
    if(g("x-score")!=="") r.bandScore=Number(g("x-score"));
    if(r.bathEnd&&r.inBed){ let a=night(r.bathEnd),b=night(r.inBed); if(b<a)b+=1440; r.bathWait=b-a; }
    refreshGame(); save(); el("sheet").innerHTML="";
    toast("保存しました（総睡眠 "+dur(r.bandTotal||0)+"）"); render(); return; }
  if(D.codeparse){
    const raw=(el("x-code").value||"").trim();
    const m=raw.match(/(\d+(?:\s*,\s*\d*){1,5})/);
    if(!m){ toast("コードを読み取れませんでした"); return; }
    const v=m[1].split(",").map(x=>x.trim()===""?null:Number(x));
    const d=D.codeparse, r=S.records[d]||(S.records[d]={});
    ["bandTotal","deep","rem","awakenings","bandScore"].forEach((k,i)=>{ if(v[i]!=null&&!isNaN(v[i])) r[k]=v[i]; });
    save(); el("sheet").innerHTML=""; toast("取り込みました"); render(); return; }
  if(D.bandparse){
    const o=parseBand(el("f-bandpaste").value);
    if(!o){ toast("数値を読み取れませんでした"); return; }
    const d=logDate||today(); const r=S.records[d]||(S.records[d]={});
    ["bandTotal","deep","rem","light","awakenings","bandScore"].forEach(k=>{ if(o[k]!=null) r[k]=o[k]; });
    save(); toast("取り込みました（総睡眠 "+(o.bandTotal!=null?dur(o.bandTotal):"—")+"）"); renderLog(); return; }

  if(D.mon){ const b=logDate||today(); const dt=parseISO(b); dt.setMonth(dt.getMonth()+Number(D.mon),1); logDate=iso(dt); renderShift(); return; }
  if(D.edit){ editSheet(D.edit); return; }
  if(D.close!==undefined){ el("sheet").innerHTML=""; return; }
  if(D.gym){ t.setAttribute("aria-pressed", t.getAttribute("aria-pressed")==="true"?"false":"true"); return; }
  if(D.esave){ saveEdit(D.esave); return; }
  if(D.edel){ delete S.shifts[D.edel]; delete S.plans[D.edel]; save(); el("sheet").innerHTML=""; renderShift(); return; }
  if(D.parse){ const y=Number(el("f-year").value)||new Date().getFullYear();
    applyShifts(parseShiftBoard(el("f-paste").value,y)); return; }
  if(D.ov){ const v=el("f-ov").value, d=addDays(today(),1);
    if(v) S.overrides[d]={wake:v}; else delete S.overrides[d]; save(); toast(v?d+" の起床を "+v+" に":"解除しました"); return; }

  if(D.art!==undefined){ openArt=D.art||null; renderKnow(); window.scrollTo(0,0); return; }
  if(D.read){ if(!S.read[D.read]){ S.read[D.read]=true; S.game.points+=10; refreshGame(); save(); toast("読了 +10pt"); }
    else toast("すでに読了しています");
    openArt=null; renderKnow(); render(); window.scrollTo(0,0); return; }

  if(D.ssave){ saveSettings(); return; }
  if(D.dl){ const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="nemulog-backup-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove();
    toast("バックアップを保存しました"); return; }
  if(D.export){ const s=JSON.stringify(S);
    navigator.clipboard?.writeText(s).then(()=>toast("クリップボードにコピーしました"),()=>toast("コピーできませんでした"));
    return; }
  if(D.import){ try{ S=merge(deep(DEFAULTS),JSON.parse(el("s-imp").value)); save(); toast("読み込みました"); render(); }
    catch(err){ toast("JSONが読めませんでした"); } return; }

  if(D.sdstart){ if(D.sdstart==="mono") startMonaural(); else startNoise(); render(); return; }
  if(D.sdstop!==undefined){ stopSound(true); toast("止めました"); render(); return; }
  if(D.sdlow!==undefined){ S.settings.sound.lowPitch=!S.settings.sound.lowPitch; save(); render(); return; }
  if(D.sdwake!==undefined){ playWakeMelody(); return; }
  if(D.expstart!==undefined){ startExperiment(Number(el("exp-test").value), Number(el("exp-days").value)); toast("実験を始めました"); render(); return; }
  if(D.expcancel!==undefined){ S.experiment=null; save(); render(); return; }
  if(D.logmore!==undefined){ logMore=!logMore; renderLog(); return; }
});
function obNext(step){
  if(step===1){
    ob.tmp.name=el("ob-name").value.trim();
    ob.tmp.usualBed=el("ob-bed").value; ob.tmp.usualWake=el("ob-wake").value;
    if(!ob.tmp.name){ toast("呼び名を入れてください"); return; }
    ob.step=1;
  } else if(step===2){
    ob.tmp.schoolWake=el("ob-sw").value; ob.tmp.preset=el("ob-preset").value; ob.tmp.cap=el("ob-cap").value;
    ob.step=2;
  } else {
    S.profile.name=ob.tmp.name; S.profile.usualBed=ob.tmp.usualBed; S.profile.usualWake=ob.tmp.usualWake;
    S.profile.goal=ob.tmp.goal||"morning";
    const c=ob.tmp.chrono||{}; const vals=Object.values(c);
    S.profile.chronotype=vals.length? (vals.reduce((a,b)=>a+b,0)/vals.length) : null;
    S.settings.schoolWake=ob.tmp.schoolWake||"07:15";
    S.settings.preset=ob.tmp.preset||"vacation";
    S.settings.vacationWakeCap=ob.tmp.cap||"09:00";
    S.profile.onboarded=true; save(); go("home"); toast("はじめましょう"); return;
  }
  renderOnboard();
}
function saveLog(){
  const d=logDate||today(); const r=S.records[d]||(S.records[d]={});
  const g=(id,num)=>{ const v=el(id)?.value; if(v===""||v==null) return null; return num?Number(v):v; };
  r.inBed=g("f-inBed"); r.wake=g("f-wake"); r.latency=g("f-lat",1);
  r.awakenings=g("f-awake",1); r.bandTotal=g("f-band",1); r.deep=g("f-deep",1); r.rem=g("f-rem",1); r.bandScore=g("f-bs",1);
  r.bathEnd=g("f-bathEnd"); r.mealTime=g("f-meal"); r.caffeineTime=g("f-caf"); r.napMin=g("f-nap",1);
  if(el("f-note")) r.note=el("f-note").value;
  if(r.bathEnd&&r.inBed){ let a=night(r.bathEnd),b=night(r.inBed); if(b<a)b+=1440; r.bathWait=b-a; }
  // 約束の判定とスタンプ
  const pr=promiseResult(addDays(d,-1));
  if(pr&&pr.ok===true&&!r.stamped){ r.stamped=true; S.game.stamps++; S.game.streak++;
    if(plan(addDays(d,-1)).isLate) S.game.lateWins=(S.game.lateWins||0)+1;
    const sc=score(d); S.game.points+=sc?Math.round(sc.total/5):10;
    if(S.game.stamps>=7){ S.game.stamps=0; S.game.cards++; S.game.points+=100; toast("スタンプカード達成 +100pt"); }
    else toast("約束を守れました。スタンプ +1");
  } else if(pr&&pr.ok===false&&!r.stamped){
    if(S.game.insurance>0){ S.game.insurance--; toast("未達ですが保険で連続記録を維持しました"); }
    else { S.game.streak=0; }
  }
  refreshGame(); save(); toast("保存しました"); render();
}
function saveEdit(ds){
  const place=el("e-place").value, start=el("e-start").value, end=el("e-end").value, ae=el("e-ae").value;
  const gym=document.querySelector("[data-gym]")?.getAttribute("aria-pressed")==="true";
  if(place&&start&&end) S.shifts[ds]={place,start,end,actualEnd:ae||null,gym};
  else delete S.shifts[ds];
  const title=el("e-title").value.trim(), pst=el("e-pst").value;
  if(title||pst) S.plans[ds]={title,startTime:pst||null,travelMin:Number(el("e-ptr").value)||20};
  else delete S.plans[ds];
  save(); el("sheet").innerHTML=""; renderShift(); toast("保存しました");
}
function saveSettings(){
  const s=S.settings;
  s.lateThreshold=el("s-lt").value; s.lateBasis=el("s-lb").value;
  s.lateGraceMin=Number(el("s-lg").value)||90; s.lateHandling=el("s-lh").value;
  s.bathMin=Number(el("s-bath").value)||22; s.careMin=Number(el("s-care").value)||20;
  s.latencyMin=Number(el("s-lat").value)||15; s.prepMin=Number(el("s-prep").value)||70;
  s.normalWindowMin=Number(el("s-nw").value)||30;
  s.preset=el("s-preset").value; s.schoolWake=el("s-sw").value; s.vacationWakeCap=el("s-cap").value;
  s.needMin=el("s-need").value?Number(el("s-need").value):null;
  s.debtWindow=Number(el("s-dw").value)||14; s.surplusWeight=Number(el("s-sw2").value);
  s.nightMode=el("s-night").value;
  document.querySelectorAll("[data-pl]").forEach(inp=>{
    const[k,f]=inp.dataset.pl.split(":"); if(!s.places[k])return;
    s.places[k][f]= (f==="afterLabel"||f==="fixedArrival")? inp.value : (Number(inp.value)||0);
  });
  save(); toast("設定を保存しました"); render();
}

document.addEventListener("input",e=>{ if(e.target&&/^x-/.test(e.target.id||"")) bandTotalUpdate(); });
document.addEventListener("change",e=>{
  if(e.target&&/^x-/.test(e.target.id||"")) bandTotalUpdate();
  if(e.target && e.target.id==="s-file" && e.target.files && e.target.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{ try{ S=merge(deep(DEFAULTS),JSON.parse(fr.result)); save(); toast("バックアップから戻しました"); render(); }
      catch(err){ toast("このファイルは読めませんでした"); } };
    fr.readAsText(e.target.files[0]);
  }
  const id=e.target&&e.target.id;
  if(id==="sd-base"||id==="sd-beat"||id==="sd-vol"||id==="sd-timer"||id==="sd-noise"){
    const sd=S.settings.sound;
    if(id==="sd-base") sd.base=Number(el("sd-base").value);
    if(id==="sd-beat") sd.beat=Number(el("sd-beat").value);
    if(id==="sd-vol") sd.volume=Number(el("sd-vol").value);
    if(id==="sd-timer") sd.timerMin=Number(el("sd-timer").value);
    if(id==="sd-noise") sd.noiseType=el("sd-noise").value;
    save();
  }
});

/* ============ URLからの取り込み（ショートカット連携） ============ */
function importFromURL(){
  const q=new URLSearchParams(location.search);
  const b=q.get("band"); if(!b) return;
  const d=q.get("date")||today();
  const v=b.split(",").map(x=>x.trim()===""?null:Number(x));
  const r=S.records[d]||(S.records[d]={});
  const keys=["bandTotal","deep","rem","awakenings","bandScore"];
  keys.forEach((k,i)=>{ if(v[i]!=null&&!isNaN(v[i])) r[k]=v[i]; });
  save();
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  setTimeout(()=>toast(md(d)+" の数値を取り込みました"),400);
}

/* ============ 起動 ============ */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
importFromURL();
tabs(); render();
</script>
